<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>typeshit</title>
<meta name="description" content="A minimal typing trainer with a pile of games, live matches with friends, and detailed stats.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2324222b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='monospace' font-weight='700' font-size='20' fill='%23b7a2f7'%3Ets%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-view="play">
<header>
  <a class="logo" href="#play" aria-label="typeshit">type<span>sh!t</span></a>
  <nav class="bar" id="tabs" aria-label="Sections">
    <a href="#play" data-v="play">play</a>
    <a href="#daily" data-v="daily">daily</a>
    <a href="#friends" data-v="friends">friends</a>
    <a href="#ranks" data-v="ranks">leaderboard</a>
    <a href="#stats" data-v="stats">stats</a>
    <a href="#custom" data-v="custom">customize</a>
    <a href="#account" data-v="account" id="who" title="account">guest</a>
  </nav>
</header>

<section id="playbar">
  <nav class="bar" id="modes" aria-label="Game mode"></nav>
  <div id="optrow"><span id="desc"></span><div class="bar" id="opts"></div></div>
</section>

<section id="friends"></section>

<main id="stage" tabindex="-1">
  <div id="hud"></div>

  <div class="view" id="line">
    <div id="track">
      <div class="me"><span>you</span><i><b id="pme"></b></i></div>
      <div><span>ghost</span><i><b id="pgh"></b></i></div>
    </div>
    <div id="words"><div id="inner"></div></div>
  </div>

  <div class="view" id="rain">
    <div id="sky"></div>
    <div id="buf" class="inbuf"></div>
  </div>

  <div class="view solo" id="solo">
    <div id="big"></div>
    <div id="ans" class="inbuf"></div>
    <div id="fuse"><b></b></div>
    <div id="solohint"></div>
  </div>

  <div class="view" id="result"></div>

  <div id="blur">click here, then start typing</div>
</main>

<section id="stats"></section>
<section id="custom"></section>
<section id="daily"></section>
<section id="ranks"></section>
<section id="account"></section>
<div id="toast" role="status"></div>
<div id="tip" role="status"></div>

<footer>
  <span id="keys"><kbd>tab</kbd> restart &nbsp; <kbd>esc</kbd> reset</span>
  <span id="best"></span>
</footer>

<input id="kb" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Typing input">

<script src="app.js"></script>
<script src="settings.js"></script>
<script src="stats.js"></script>
<script src="friends.js"></script>
<script src="daily.js"></script>
<script src="ranks.js"></script>
</body>
</html>
