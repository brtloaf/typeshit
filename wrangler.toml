name = "typeshit"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# the static site
[assets]
directory = "./public"
binding = "ASSETS"

# one Room object per friends room, holding the live race state
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
