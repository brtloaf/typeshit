name = "typeshit"
main = "src/worker.js"
compatibility_date = "2025-06-01"

# the static site
[assets]
directory = "./public"
binding = "ASSETS"

# one Room object per friends room, holding the live race state
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# accounts, the daily game and the leaderboards (one object, SQLite storage)
[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Board"]
